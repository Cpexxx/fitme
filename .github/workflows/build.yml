# Buduje Fitme dla Windows i Linuksa po każdym pushu na main i wystawia obie paczki
# w wydaniu „latest” (zakładka Releases repo): Fitme-windows.zip i Fitme-linux.tar.gz.
name: Build Fitme

on:
  push:
    branches: [main]
    paths: ['js/**', 'vendor/**', 'fitme.html', 'legal.html', 'app/**', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      windows:
        description: 'Zbuduj też wersję Windows'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-fitme
  cancel-in-progress: true

jobs:
  # Windows na razie tylko na żądanie (Actions -> Build Fitme -> Run workflow -> windows); użytkownik testuje na Kubuntu
  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Paczka Windows
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run package
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path app/dist/Fitme-win32-x64 -DestinationPath Fitme-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: Fitme-windows.zip, retention-days: 7 }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Paczka Linux
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run package:linux
      - name: Skrypt startowy i tar.gz
        run: |
          D=app/dist/Fitme-linux-x64
          printf '#!/bin/sh\n# Start Fitme (Ubuntu 23.10+ blokuje piaskownice Chromium dla aplikacji spoza pakietow)\ncd "$(dirname "$0")"\nexec ./Fitme --no-sandbox "$@"\n' > $D/fitme.sh
          chmod +x $D/fitme.sh $D/Fitme
          tar -C app/dist -czf Fitme-linux.tar.gz Fitme-linux-x64
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: Fitme-linux.tar.gz, retention-days: 7 }

  # wersja przeglądarkowa: gałąź gh-pages -> https://cpexxx.github.io/fitme/
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publikacja na gh-pages
        run: |
          rm -rf site && mkdir site
          cp fitme.html site/index.html && cp fitme.html site/fitme.html && cp legal.html site/legal.html && cp -r js vendor site/ && touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Pages: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages

  release:
    needs: [windows, linux]
    if: always() && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Wydanie „latest”
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          MSG=$(printf 'Commit %s (%s)\n\nLinux (pobiera do folderu Pobrane i uruchamia):\n  D=$(xdg-user-dir DOWNLOAD); cd "$D" && rm -rf Fitme-linux-x64 Fitme-linux.tar.gz && wget -q --show-progress https://github.com/Cpexxx/fitme/releases/download/latest/Fitme-linux.tar.gz && tar -xzf Fitme-linux.tar.gz && ./Fitme-linux-x64/fitme.sh\nWindows (gdy zbudowany): rozpakuj Fitme-windows.zip i uruchom Fitme.exe.' "${GITHUB_SHA::7}" "$(date -u +'%Y-%m-%d %H:%M UTC')")
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest $(ls Fitme-*.zip Fitme-*.tar.gz 2>/dev/null) --target "$GITHUB_SHA" --title "Fitme – najnowsza wersja" --notes "$MSG" --latest
