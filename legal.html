<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitme – informacje prawne</title>
<script>
(function(){var t='light',v=null;try{v=sessionStorage.getItem('fitme.theme');if(v==null){var c=JSON.parse(localStorage.getItem('fitme.consent')||'null');if(c&&c.prefs)v=localStorage.getItem('fitme.theme');}}catch(e){}if(v==='dark'||v==='light')t=v;document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
@font-face{font-family:"Archivo";font-style:normal;font-display:swap;font-weight:100 900;font-stretch:62% 125%;src:url(vendor/fonts/archivo-latin-ext-wdth-normal.woff2) format("woff2-variations");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Archivo";font-style:normal;font-display:swap;font-weight:100 900;font-stretch:62% 125%;src:url(vendor/fonts/archivo-latin-wdth-normal.woff2) format("woff2-variations");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--bg:#F3EBDD;--card:#FBF7F0;--shell:rgba(140,105,50,.07);--hair:rgba(80,58,24,.12);--ink:#000;--text:#211B13;--muted:#7A6C5A;--gold:#9C762F;--on-ink:#FBF7F0;color-scheme:light}
:root[data-theme="dark"]{--bg:#17130E;--card:#221C15;--shell:rgba(201,165,94,.06);--hair:rgba(230,210,170,.12);--ink:#F3E9D6;--text:#EFE5D2;--muted:#AA9B82;--gold:#C9A55E;--on-ink:#1E1912;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Archivo","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 80px}
a{color:var(--gold)}
.logo{font-stretch:125%;font-weight:850;font-size:22px;letter-spacing:-.03em;text-decoration:none;color:var(--text)}
.logo i{font-style:normal;color:var(--gold)}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 26px}
nav a{border:1px solid var(--hair);background:var(--card);padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--text);text-decoration:none}
nav a[aria-current="page"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
article{background:var(--card);border:1px solid var(--hair);border-radius:24px;padding:26px clamp(18px,4vw,36px)}
h1{margin:0 0 14px;font-size:clamp(28px,5vw,40px);font-stretch:120%;font-weight:800;letter-spacing:-.03em;line-height:1.05}
h3{margin:24px 0 6px;font-size:16.5px}
.lead{font-size:16px;color:var(--muted)}
.lver{margin-top:26px;color:var(--muted);font-size:13px}
mark.todo{background:#f6d56a;color:#3a2c00;border-radius:4px;padding:0 4px}
.ltab{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
.ltab th,.ltab td{text-align:left;padding:8px 6px;border-top:1px solid var(--hair);vertical-align:top}
.ltab td:first-child{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:nowrap}
@media (max-width:560px){.ltab td:first-child{white-space:normal;word-break:break-all}}
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="fitme.html">FIT<i>ME</i></a>
  <nav id="nav" aria-label="Dokumenty"></nav>
  <article id="doc"><h1 id="title"></h1><div id="body"></div></article>
</div>
<script src="js/config.js?v=20"></script>
<script src="js/legal.js?v=20"></script>
<script>
(function(){
  var nav=document.getElementById('nav');
  function show(){
    var k=(location.hash||'#terms').slice(1);if(!LEGAL_DOCS[k])k='terms';
    nav.innerHTML='';
    Object.keys(LEGAL_DOCS).forEach(function(d){var a=document.createElement('a');a.href='#'+d;a.textContent=LEGAL_DOCS[d];if(d===k)a.setAttribute('aria-current','page');nav.appendChild(a);});
    document.getElementById('title').textContent=LEGAL_DOCS[k];document.title='Fitme – '+LEGAL_DOCS[k].toLowerCase();
    var b=document.getElementById('body');b.innerHTML=legalHTML(k);
    b.querySelectorAll('[data-legal]').forEach(function(a){a.href='#'+a.getAttribute('data-legal');});
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',show);show();
})();
</script>
</body>
</html>
